# Configurazione Database
spring.datasource.url=jdbc:h2:file:${user.home}/.nutricare/data/nutricare;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Configurazione JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Configurazione Liquibase
spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml
spring.liquibase.enabled=true

# Console H2 — abilitata solo nel profilo dev (vedi application-dev.properties)
spring.h2.console.enabled=false

# Server — bind solo a localhost, non esposto sulla rete locale
server.address=127.0.0.1
server.port=8080
server.servlet.context-path=/api/nutricare

# AES-GCM encryption key for API keys (32 bytes when decoded).
nutricare.crypto.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# OpenAI API Key for ChatGPT models
nutricare.openai.api-key=replace-me

# Anthropic API Key for Claude models
nutricare.anthropic.api-key=replace-me

# Google Gemini API Key (gratuita da https://aistudio.google.com/apikey)
nutricare.gemini.api-key=replace-me

# Versione applicazione (iniettata da Maven al build)
app.version=@project.version@

# Logging
logging.level.root=INFO
logging.level.com.angeloni.nutricare=DEBUG