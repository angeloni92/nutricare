#Cors
cors.allowed.origin=http://localhost:4200

# Configurazione Database
spring.datasource.url=jdbc:h2:mem:nutricare;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Configurazione JPA/Hibernate 
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Configurazione Liquibase
spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml
spring.liquibase.enabled=true

# Console H2 (sviluppo locale)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configurazione Artemis
spring.artemis.mode=native
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=nutricare
spring.artemis.password=nutricare
# Artemis queue
jms.queue.diet.start=NUTRICARE.SVIL::app.diet.start

