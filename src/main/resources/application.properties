# Configurazione Database
spring.datasource.url=jdbc:h2:mem:nutricare;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Configurazione JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Configurazione Liquibase
spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml
spring.liquibase.enabled=true

# Console H2 (sviluppo locale)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server (porta 8080 necessaria per callback OAuth GitHub Copilot)
server.port=8080
server.servlet.context-path=/api/nutricare

# GitHub Copilot SSO (OAuth)
nutricare.copilot.oauth.client-id=178c6fc778ccc68e1d6a
nutricare.copilot.oauth.client-secret=replace-me
nutricare.copilot.oauth.redirect-uri=http://localhost:8080/api/nutricare/auth/copilot/callback
nutricare.copilot.oauth.authorize-url=https://github.com/login/oauth/authorize
nutricare.copilot.oauth.token-url=https://github.com/login/oauth/access_token
nutricare.copilot.oauth.user-url=https://api.github.com/user
nutricare.copilot.oauth.orgs-url=https://api.github.com/user/orgs
nutricare.copilot.oauth.required-org=
nutricare.copilot.oauth.state-ttl-seconds=600

# Base64 key for AES-GCM token encryption (32 bytes when decoded).
nutricare.copilot.crypto.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# OpenAI API Key for ChatGPT models
nutricare.openai.api-key=replace-me

# Anthropic API Key for Claude models
nutricare.anthropic.api-key=replace-me

# Logging
logging.level.root=INFO
logging.level.com.angeloni.nutricare=DEBUG